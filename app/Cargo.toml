[package]
name = "passerelle"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Belajar bahasa Prancis offline, dari nol sampai lancar."
authors = ["Darryl Fatha"]

[[bin]]
name = "Passerelle"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = "0.31"
egui_extras ={ version = "0.31", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.15"
hound = "3.5"
tts = "0.26"
rfd = "0.15"
rand = "0.8"
resvg = "0.45"

[build-dependencies]
resvg = "0.45"
png = "0.17"
